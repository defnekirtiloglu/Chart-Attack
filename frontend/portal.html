<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSCEnario Rounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f2e8; --paper-2:#fffdf8; --ink:#1f1d1a; --ink-2:#5c574e; --ink-3:#8d877b; --rule:#e4ddcc;
  --walter:#c7791a; --walter-bg:#fbeedb; --ayse:#2463c7; --ayse-bg:#e3ecfa; --okafor:#7a4cc2; --okafor-bg:#efe6fb;
  --ok:#1f8a5b; --ok-bg:#e1f3ea; --warn:#b97c04; --warn-bg:#fdf1d4; --bad:#cf3b2f; --bad-bg:#fbe5e2;
  --serif:"Source Serif 4",Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif;
  --radius:14px; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 24px -12px rgba(60,40,10,.25);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer} a{color:inherit}
:focus-visible{outline:2px solid var(--ayse);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;height:60px;background:rgba(246,242,232,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:16px;padding:0 20px}
.brand{font:700 19px var(--serif);text-decoration:none;white-space:nowrap}
.brand span{color:var(--ink-3);font-weight:400}
.crumbs{color:var(--ink-3);font-size:14px;display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.crumbs a{text-decoration:none;color:var(--ink-2)} .crumbs a:hover{text-decoration:underline}
.top .sp{flex:1}
.roles{display:flex;gap:2px;background:#ece6d7;padding:3px;border-radius:999px}
.roles button{border:0;background:none;padding:5px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--ink-2)}
.roles button[aria-pressed=true]{background:var(--paper-2);color:var(--ink);box-shadow:var(--shadow)}
.mode{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.mode.live{color:var(--ok);border-color:#b9dfcb;background:var(--ok-bg)} .mode.down{color:var(--bad);border-color:#f0c4be;background:var(--bad-bg)}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 60px)}
nav.side{border-right:1px solid var(--rule);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
nav.side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500}
nav.side a:hover{background:#efe9db}
nav.side a.on{background:var(--paper-2);color:var(--ink);box-shadow:var(--shadow)}
nav.side .sub{font-size:12px;color:var(--ink-3);padding:14px 12px 4px}
nav.side a.course{padding:7px 12px 7px 32px;font-size:14px;font-weight:500}
nav.side a.course.on{box-shadow:none;background:transparent;color:var(--ink);border-left:3px solid var(--ink);border-radius:0 10px 10px 0}
nav.side .dot{width:10px;height:10px;border-radius:3px;flex:none}
main{padding:28px 32px 80px;max-width:1180px;width:100%}

/* type */
h1{font:600 30px/1.15 var(--serif);margin:0;letter-spacing:-.015em}
h2{font:600 21px/1.2 var(--serif);margin:0}
h3{font:600 15px var(--sans);margin:0}
.lede{color:var(--ink-2);margin:6px 0 0;max-width:680px}
.muted{color:var(--ink-3)} .small{font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}

/* controls */
.btn{border:0;border-radius:10px;padding:9px 15px;font-weight:600;background:var(--ink);color:var(--paper);display:inline-flex;gap:8px;align-items:center;white-space:nowrap;text-decoration:none;font-size:14px}
.btn:hover{filter:brightness(1.15)} .btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)} .btn.ghost:hover{background:#efe9db;filter:none}
.btn.small{padding:6px 11px;font-size:13px;border-radius:8px}
label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin:12px 0 6px}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--rule);background:#fff;border-radius:10px;padding:10px 12px;outline:none}
textarea{min-height:120px;resize:vertical}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}

/* class cards */
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.cls{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;min-height:150px;transition:transform .15s}
.cls:hover{transform:translateY(-2px)}
.cls .banner{padding:16px 18px 14px;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.cls .banner b{font:600 21px/1.15 var(--serif)} .cls .banner span{font-size:13px;opacity:.9}
.cls .meta{padding:12px 18px;color:var(--ink-2);font-size:13.5px;display:flex;justify-content:space-between;gap:8px;margin-top:auto;border-top:1px solid var(--rule)}
.cls.new{border:1.5px dashed var(--rule);box-shadow:none;background:transparent;align-items:center;justify-content:center;color:var(--ink-2);font-weight:600;cursor:pointer}
.cls.new:hover{background:#efe9db}

/* class page */
.cbanner{border-radius:var(--radius);color:#fff;padding:26px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.cbanner h1{color:#fff} .cbanner p{margin:4px 0 0;opacity:.9}
.joincode{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 14px;text-align:right}
.joincode small{display:block;font-size:12px;opacity:.85} .joincode b{font:700 24px var(--serif);letter-spacing:.12em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:14px 0 22px}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--rule)}
.item:first-child{border-top:0}
a.item{text-decoration:none;border-radius:10px} a.item:hover{background:#f3eee2}
.item .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.item .grow{flex:1;min-width:0} .item .title{font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.draft{background:var(--warn-bg);color:#7a5200} .pill.published{background:var(--ok-bg);color:#155c3d}
.pill.bad{background:var(--bad-bg);color:#8f2219} .pill.info{background:var(--okafor-bg);color:#4b2c80}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin:2px 4px 2px 0;background:var(--bad-bg);color:#8f2219}
.chip.rescued{background:var(--okafor-bg);color:#4b2c80}
.focus{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin:2px 4px 2px 0;background:var(--walter-bg);color:#6b3e07}
.empty{color:var(--ink-3);font-size:14px;padding:10px 0}
.section{margin-top:28px} .section > h2{margin-bottom:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.score{font-weight:600} .score.none{color:var(--ink-3);font-weight:400}
.grade-link{text-decoration:none;border-bottom:1px dashed var(--ink-3)}

/* agent */
.steps-live{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
.steps-live li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px dashed var(--rule)}
.steps-live li:first-child{border-top:0}
.steps-live .ic{width:18px;flex:none;text-align:center} .steps-live .ok{color:var(--ok)} .steps-live .no{color:var(--bad)} .steps-live .plan{color:var(--okafor)}
.agent-plan ol{margin:6px 0 10px;padding-left:20px;font-size:14px}
.agent-plan li.completed{color:var(--ok);text-decoration:line-through} .agent-plan li.in_progress{font-weight:600}
.agent-files details{border:1px solid var(--rule);border-radius:8px;margin:6px 0;background:#fff}
.agent-files summary{padding:6px 10px;cursor:pointer;font-size:13px}
.agent-files pre{margin:0;padding:10px;max-height:280px;overflow:auto;font-size:12px;border-top:1px solid var(--rule);white-space:pre-wrap}
.approve-card{margin-top:12px;border:2px solid var(--okafor);border-radius:12px;padding:14px;background:var(--okafor-bg)}
code{font-size:12.5px;background:#f1ece0;padding:1px 5px;border-radius:5px}
.review{margin-top:14px;border-left:3px solid var(--okafor);padding:4px 0 4px 12px} .review li{margin:4px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* analytics */
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.meter{display:block;height:10px;background:#efe9db;border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bad);border-radius:999px}
.att{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:#155c3d}

.transcript{max-height:440px;overflow:auto;border:1px solid var(--rule);border-radius:10px;padding:12px;background:#fff}
.line{margin:0 0 8px;font-size:14px} .line b{font-weight:600}
.line.patient b{color:var(--walter)} .line.caregiver b{color:var(--ayse)} .line.cardiologist b,.line.pharmacist b{color:var(--okafor)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)} .toast.err{background:var(--bad)}
@media (max-width:900px){.shell{grid-template-columns:1fr} nav.side{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--rule);padding:8px} nav.side .sub{display:none} main{padding:20px 16px 60px} .split{grid-template-columns:1fr} .crumbs{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">OSCEnario Rounds</a>
  <div class="crumbs" id="crumbs"></div>
  <div class="sp"></div>
  <div class="roles" role="group" aria-label="View as">
    <button id="as-prof" aria-pressed="true">Professor</button>
    <button id="as-student" aria-pressed="false">Student</button>
  </div>
  <div class="mode" id="mode">Checking…</div>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="view"><p class="empty">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const params = new URLSearchParams(location.search);
const API = (params.get('api') || window.WALTER_API || (location.port === '5500' || location.protocol === 'file:' ? 'http://127.0.0.1:8000' : location.origin)).replace(/\/$/, '');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#2463c7', '#7a4cc2', '#1f8a5b', '#c7791a', '#b0433a', '#2f6f7a'];
const color = id => COLORS[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const fmtDate = d => { if (!d) return ''; const x = new Date(d.length === 10 ? d + 'T12:00' : d); return isNaN(x) ? d : x.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
const roundsUrl = q => 'index.html?' + new URLSearchParams(q).toString();
const STAGE = { ed: 'ED', handoff: 'handoff', discharge: 'discharge' };
const state = { role: localStorage.getItem('rounds.role') || 'prof', netid: localStorage.getItem('rounds.netid') || '', cases: [], timer: null };

async function api(method, path, body) {
  const res = await fetch(API + path, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
  return data;
}
async function stream(path, body, onEvent) {
  const res = await fetch(API + path, { method: 'POST', headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || `Request failed (${res.status})`); }
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      if (chunk.startsWith('data: ')) { try { onEvent(JSON.parse(chunk.slice(6))); } catch {} }
    }
  }
}
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200); }
const crumbs = list => $('#crumbs').innerHTML = list.map(([t, h]) => h ? `<span>›</span><a href="${h}">${esc(t)}</a>` : `<span>›</span><span>${esc(t)}</span>`).join('');
const view = html => { $('#view').innerHTML = html; window.scrollTo(0, 0); };

/* ======================= routing ======================= */
function setRole(r) {
  state.role = r; localStorage.setItem('rounds.role', r);
  $('#as-prof').setAttribute('aria-pressed', r === 'prof'); $('#as-student').setAttribute('aria-pressed', r === 'student');
  if (location.hash !== '#/') location.hash = '#/'; else route();
}
$('#as-prof').onclick = () => setRole('prof');
$('#as-student').onclick = () => setRole('student');
window.addEventListener('hashchange', route);

async function side(active, classes, tab) {
  const prof = state.role === 'prof';
  const list = classes || await api('GET', prof ? '/classes' : `/classes?student_id=${encodeURIComponent(state.netid)}`).catch(() => []);
  $('#side').innerHTML = `
    <a href="#/" class="${active === 'home' ? 'on' : ''}">🏫 Classes</a>
    ${prof ? `<a href="#/library" class="${active === 'library' ? 'on' : ''}">📚 Case library</a>` : ''}
    ${list.length ? '<div class="sub">Your classes</div>' : ''}
    ${list.map(c => `<a href="#/class/${esc(c.id)}" class="${active === c.id && !tab ? 'on' : ''}"><span class="dot" style="background:${color(c.id)}"></span>${esc(c.name)}</a>`
      + (active === c.id && prof ? ['classwork', 'people', 'grades', 'analytics'].map(t => `<a class="course ${tab === t ? 'on' : ''}" href="#/class/${esc(c.id)}/${t}">${{ classwork: 'Assignments', people: 'People', grades: 'Grades', analytics: 'Analytics' }[t]}</a>`).join('') : '')).join('')}`;
}

async function route() {
  clearInterval(state.timer);
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  $('#as-prof').setAttribute('aria-pressed', state.role === 'prof'); $('#as-student').setAttribute('aria-pressed', state.role === 'student');
  try {
    if (state.role === 'prof') {
      if (parts[0] === 'library' && parts[1] === 'new') return await pNewCase();
      if (parts[0] === 'library') return await pLibrary();
      if (parts[0] === 'class' && parts[2] === 'assignment') return await pAssignment(parts[1], parts[3]);
      if (parts[0] === 'class') return await pClass(parts[1], parts[2] || 'classwork');
      return await pHome();
    }
    if (!state.netid) return sSignIn();
    if (parts[0] === 'class') return await sClass(parts[1]);
    return await sHome();
  } catch (e) { view(`<div class="card"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p><a class="btn ghost" href="#/">Back to classes</a></div>`); }
}

/* ======================= professor: home ======================= */
async function pHome() {
  crumbs([]);
  const classes = await api('GET', '/classes');
  await side('home', classes);
  view(`
    <div class="head"><div><h1>Classes</h1><p class="lede">Create a class, share its join code, and assign cases. Students' results come back here.</p></div></div>
    <div class="card" id="new-class" hidden style="margin-bottom:18px;max-width:520px">
      <h3>New class</h3>
      <label for="c-name">Class name</label><input type="text" id="c-name" placeholder="Clinical Skills III">
      <label for="c-section">Section</label><input type="text" id="c-section" placeholder="Fall 2026">
      <div class="err" id="c-err"></div>
      <div class="row"><button class="btn" id="c-go">Create class</button><button class="btn ghost" id="c-cancel">Cancel</button></div>
    </div>
    <div class="classes">
      ${classes.slice().reverse().map(c => `
        <a class="cls" href="#/class/${esc(c.id)}">
          <div class="banner" style="background:${color(c.id)}"><b>${esc(c.name)}</b><span>${esc(c.section || '')}</span></div>
          <div class="meta"><span>${c.student_count} student${c.student_count === 1 ? '' : 's'} · ${c.assignment_count} assignment${c.assignment_count === 1 ? '' : 's'}</span><span>Code <b>${esc(c.code)}</b></span></div>
        </a>`).join('')}
      <button class="cls new" id="c-open">+ New class</button>
    </div>`);
  const open = () => { $('#new-class').hidden = false; $('#c-name').focus(); };
  $('#c-open').onclick = open;
  if (!classes.length) open();
  $('#c-cancel').onclick = () => $('#new-class').hidden = true;
  $('#c-name').oninput = () => $('#c-err').textContent = '';
  $('#c-go').onclick = async () => {
    const name = $('#c-name').value.trim();
    if (!name) { $('#c-err').textContent = 'Give the class a name.'; $('#c-name').focus(); return; }
    try { const c = await api('POST', '/classes', { name, section: $('#c-section').value.trim() }); toast('Class created'); location.hash = `#/class/${c.id}`; }
    catch (e) { $('#c-err').textContent = e.message; }
  };
}

/* ======================= professor: one class ======================= */
async function pClass(cid, tab) {
  const [cls, all] = await Promise.all([api('GET', `/classes/${cid}`), api('GET', `/assignments?class_id=${cid}`)]);
  await side(cid, null, tab);
  const NAMES = { classwork: 'Assignments', people: 'People', grades: 'Grades', analytics: 'Analytics' };
  crumbs([[cls.name, `#/class/${cid}`], [NAMES[tab] || tab]]);
  view(`
    <div class="cbanner" style="background:${color(cid)}">
      <div><h1>${esc(cls.name)}</h1><p>${esc(cls.section || '')}</p></div>
      <div class="joincode"><small>Class code</small><b>${esc(cls.code)}</b></div>
    </div>
    <h2 style="margin:22px 0 14px">${NAMES[tab] || ''}</h2>
    <div id="tab"></div>`);
  if (tab === 'people') return tPeople(cls);
  if (tab === 'grades') return tGrades(cid);
  if (tab === 'analytics') return tAnalytics(cid);
  return tClasswork(cls, all);
}

async function tClasswork(cls, all) {
  if (!state.cases.length) state.cases = await api('GET', '/cases?include_drafts=true');
  const pub = state.cases.filter(c => c.status === 'published');
  $('#tab').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <button class="btn" id="a-open">+ Assign a case</button>
      <a class="btn ghost small" href="#/library">Case library</a>
    </div>
    <div class="card" id="a-form" hidden style="margin-bottom:16px">
      <h3>Assign a case to ${esc(cls.name)}</h3>
      <div class="row" style="margin-top:10px;align-items:flex-end">
        <div style="flex:2;min-width:200px"><label for="a-case">Case</label>
          <select id="a-case">${pub.length ? pub.map(p => `<option value="${esc(p.id)}">${esc(p.title)}</option>`).join('') : '<option value="">No published cases yet</option>'}</select></div>
        <div style="flex:1;min-width:140px"><label for="a-due">Due</label><input type="date" id="a-due"></div>
        <button class="btn" id="a-go" ${pub.length ? '' : 'disabled'}>Assign</button>
      </div>
      ${pub.length ? '' : '<p class="small muted">Publish a case in the <a href="#/library">case library</a> first.</p>'}
    </div>
    <div class="card"><div class="list">${all.length ? all.slice().reverse().map(a => `
      <a class="item" href="#/class/${esc(cls.id)}/assignment/${esc(a.id)}">

const KIND = { question: 'Questions asked', fact_found: 'Facts found', fact_dodged: 'Dodged by the patient', handoff: 'Handoffs written',

async function tAnalytics(cid) {
  const draw = async () => {
    const a = await api('GET', `/classes/${cid}/analytics`);
    const max = Math.max(1, ...a.most_lost.map(r => r.losses));
    const by = {}; a.trend.forEach(t => (by[t.student_id] = by[t.student_id] || []).push(t));
    const hour = a.live.reduce((m, r) => (m[r.kind] = (m[r.kind] || 0) + r.n, m), {});
    if (!$('#tab')) return;
    $('#tab').innerHTML = `<div class="split">

        ${a.most_lost.length ? a.most_lost.map(r => `<div class="bar-row"><span>${esc(r.label)} <span class="muted">at ${esc(STAGE[r.stage] || r.stage)}</span></span><span class="meter"><i style="width:${Math.round(100 * r.losses / max)}%"></i></span><b>${r.losses}</b></div>`).join('') : '<div class="empty">No finished attempts yet.</div>'}</div>

function reviewHtml(review, validation) {
  let h = '';
  if (validation && ((validation.errors || []).length || (validation.warnings || []).length))
    h += `<div class="review"><b>Structure check</b><ul>${(validation.errors || []).map(e => `<li style="color:var(--bad)">${esc(e)}</li>`).join('')}${(validation.warnings || []).map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
  if (review && (review.issues || []).length)
    h += `<div class="review"><b>Clinical review: ${esc(review.verdict || '')}</b><ul>${review.issues.map(i => `<li><span class="pill ${i.severity === 'high' ? 'bad' : 'draft'}">${esc(i.severity)}</span> ${esc(i.where ? i.where + ': ' : '')}${esc(i.issue)}</li>`).join('')}</ul></div>`;
  return h;
}

/* Renders a deep-agent run: live plan, steps, sub-agents, files, and the approval step. */
function agentView(box, onSaved) {
  box.innerHTML = `<div class="agent-plan"></div><ul class="steps-live"></ul><div class="agent-files"></div><div class="agent-approve"></div>`;
  const ul = box.querySelector('.steps-live'), planBox = box.querySelector('.agent-plan'), filesBox = box.querySelector('.agent-files'), approveBox = box.querySelector('.agent-approve');
  let saved = null, runId = null;
  const done = () => ul.querySelectorAll('.spin').forEach(s => s.outerHTML = '✓');
  const add = (ic, cls, html, live) => { done(); const li = document.createElement('li');
    li.innerHTML = `<span class="ic ${cls}">${live ? '<span class="spin" style="width:11px;height:11px"></span>' : ic}</span><span>${html}</span>`; ul.appendChild(li); };
  const showFiles = files => { if (files && files.length) filesBox.innerHTML = `<b class="small">Agent workspace</b>` + files.map(f => `<details><summary><code>${esc(f.path)}</code> <span class="muted small">${f.size} bytes</span></summary><pre>${esc(f.content)}</pre></details>`).join(''); };
  const v = { on(ev) {
    if (ev.type === 'run') runId = ev.run_id;
    else if (ev.type === 'plan') planBox.innerHTML = '<b class="small">Plan</b><ol>' + ev.items.map(i => { const it = typeof i === 'string' ? { text: i, status: 'pending' } : i; return `<li class="${esc(it.status)}">${esc(it.text)}</li>`; }).join('') + '</ol>';
    else if (ev.type === 'subagent') add('', 'plan', '<b>' + esc(ev.label) + '</b>', true);
    else if (ev.type === 'file') add('', '', `${esc(ev.label.split(' ')[0])} <code>${esc(ev.path)}</code>`, true);
    else if (ev.type === 'tool') add('', '', esc(ev.label), true);
    else if (ev.type === 'result') add(ev.ok ? '✓' : '✗', ev.ok ? 'ok' : 'no', ev.ok ? 'Structure check passed' : 'Structure check rejected it: ' + esc(ev.errors.join('; ')));
    else if (ev.type === 'review') add('✎', 'plan', esc(ev.text));
    else if (ev.type === 'error') add('!', 'no', esc(ev.message));
    else if (ev.type === 'approval') {
      done(); runId = ev.run_id || runId; showFiles(ev.files);
      approveBox.innerHTML = `<div class="approve-card"><b>The agent wants to save ${esc(ev.title || 'this case')}</b>
        <p class="small" style="margin:4px 0 8px">${esc(ev.summary || '')}</p>
        <p class="muted small" style="margin:0 0 8px">Read the draft and the reviews in the workspace above. Approve it, or send it back with a note. The agent remembers your note for future cases.</p>
        <textarea class="ap-note" placeholder="Make the son speak Spanish, and make the smoking harder to uncover." style="min-height:60px"></textarea>
        <div class="err ap-err"></div>
        <div class="row"><button class="btn small ap-yes">Approve and save</button><button class="btn ghost small ap-no">Send back with note</button></div></div>`;
      const go = async approve => {
        const note = approveBox.querySelector('.ap-note').value.trim();
        if (!approve && !note) { approveBox.querySelector('.ap-err').textContent = 'Say what to change.'; return; }
        approveBox.innerHTML = '';
        try { await stream(`/cases/agent/${runId}/decision`, { approve, note }, e => v.on(e)); } catch (e) { add('!', 'no', esc(e.message)); }
      };
      approveBox.querySelector('.ap-yes').onclick = () => go(true);
      approveBox.querySelector('.ap-no').onclick = () => go(false);
    }
    else if (ev.type === 'saved') { saved = ev; done(); showFiles(ev.files); add('✓', 'ok', `<b>${esc(ev.title)}</b> saved as a draft.`); if (onSaved) onSaved(ev); }
  }, get saved() { return saved; } };
  return v;
}

      <button class="btn" id="j-open">+ Join class</button></div>
    <div class="card" id="j-form" ${classes.length ? 'hidden' : ''} style="max-width:460px;margin-bottom:18px">
      <h3>Join a class</h3><label for="j-code">Class code from your professor</label>
      <div class="row"><input type="text" id="j-code" placeholder="7DNT7J" style="flex:1;text-transform:uppercase"><button class="btn" id="j-go">Join</button></div>
      <div class="err" id="j-err"></div></div>
    <div class="classes">${classes.slice().reverse().map(c => `
      <a class="cls" href="#/class/${esc(c.id)}">
        <div class="banner" style="background:${color(c.id)}"><b>${esc(c.name)}</b><span>${esc(c.section || '')}</span></div>
        <div class="meta"><span>${c.assignment_count} assignment${c.assignment_count === 1 ? '' : 's'}</span></div></a>`).join('')}</div>`);
  $('#s-out').onclick = e => { e.preventDefault(); localStorage.removeItem('rounds.netid'); state.netid = ''; route(); };
  $('#j-open').onclick = () => { $('#j-form').hidden = false; $('#j-code').focus(); };
  $('#j-code').oninput = () => $('#j-err').textContent = '';
  $('#j-go').onclick = async () => {
    const code = $('#j-code').value.trim();
    if (!code) { $('#j-err').textContent = 'Enter the class code.'; return; }
    try { const c = await api('POST', '/classes/join', { code, student_id: state.netid }); toast(`Joined ${c.name}`); location.hash = `#/class/${c.id}`; }
    catch (e) { $('#j-err').textContent = e.message; }
  };
}

async function sClass(cid) {
  const [cls, mine] = await Promise.all([api('GET', `/classes/${cid}`), api('GET', `/assignments?student_id=${encodeURIComponent(state.netid)}`)]);
  await side(cid);
  crumbs([[cls.name]]);
  const here = mine.filter(a => a.class_id === cid);
  const todo = here.filter(a => !a.done), done = here.filter(a => a.done);
  const row = a => `<div class="item">
      <span class="ico" style="background:${color(cid)}22;color:${color(cid)}">📋</span>
      <div class="grow"><div class="title">${esc(a.title)} ${a.student_id ? '<span class="pill info">Just for you</span>' : ''}</div>
        <div class="muted small">${a.due ? 'Due ' + esc(fmtDate(a.due)) : 'No due date'}${a.done ? ` · ${esc(a.score)} key facts made it home` : ''}</div>
        ${(a.focus || []).length ? `<div style="margin-top:4px"><span class="small muted">Practice next: </span>${a.focus.map(f => `<span class="focus" title="${esc(f.why)}">${esc(f.skill)}</span>`).join('')}</div>` : ''}</div>
      <a class="btn ${a.done ? 'ghost' : ''} small" href="${roundsUrl({ assignment: a.id, student: state.netid })}">${a.done ? 'Try again' : 'Start rounds'}</a></div>`;
  view(`
    <div class="cbanner" style="background:${color(cid)}"><div><h1>${esc(cls.name)}</h1><p>${esc(cls.section || '')}</p></div></div>
    <div class="section"><h2>To do</h2><div class="card"><div class="list">${todo.length ? todo.map(row).join('') : '<div class="empty">All caught up.</div>'}</div></div></div>
    <div class="section"><h2>Done</h2><div class="card"><div class="list">${done.length ? done.map(row).join('') : '<div class="empty">Nothing finished yet.</div>'}</div></div></div>`);
}

/* ======================= boot ======================= */
(async () => {
  try { await api('GET', '/health'); $('#mode').textContent = 'Live API'; $('#mode').className = 'mode live'; }
  catch { $('#mode').textContent = 'Server offline'; $('#mode').className = 'mode down'; $('#mode').title = 'Start it with: uvicorn backend.app:app --reload'; }
  if (params.get('role') === 'student') { state.role = 'student'; localStorage.setItem('rounds.role', 'student'); }
  route();
})();
</script>
</body>
</html>

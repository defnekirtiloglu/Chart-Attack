<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Answer key · OSCEnario Rounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kalam:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f2e8; --paper-2:#fffdf8; --ink:#1f1d1a; --ink-2:#5c574e; --ink-3:#8d877b; --rule:#e4ddcc;
  --walter:#c7791a; --walter-bg:#fbeedb; --ayse:#2463c7; --ayse-bg:#e3ecfa; --okafor:#7a4cc2; --okafor-bg:#efe6fb;
  --ok:#1f8a5b; --ok-bg:#e1f3ea; --warn:#b97c04; --warn-bg:#fdf1d4; --bad:#cf3b2f; --bad-bg:#fbe5e2;
  --serif:"Source Serif 4",Georgia,serif; --sans:Inter,system-ui,-apple-system,sans-serif; --hand:Kalam,"Comic Sans MS",cursive;
  --radius:14px; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 24px -12px rgba(60,40,10,.25);
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
header{border-bottom:1px solid var(--rule);background:rgba(246,242,232,.92)}
.bar{max-width:1100px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand{font:700 19px var(--serif)} .brand span{color:var(--ink-3);font-weight:400}
.bar .sp{flex:1}
.btn{border:0;border-radius:10px;padding:8px 14px;font:600 14px var(--sans);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
main{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
h1{font:600 30px/1.15 var(--serif);margin:0 0 6px;letter-spacing:-.015em}
h2{font:600 21px/1.2 var(--serif);margin:36px 0 12px}
.lede{color:var(--ink-2);max-width:720px;margin:0}
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.who{display:flex;gap:12px;align-items:flex-start}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.av.p{background:#5a3610;color:#ffc477} .av.c{background:var(--ayse);color:#fff}
.who b{font-weight:600} .who p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
ol.how{margin:0;padding-left:20px} ol.how li{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--rule);background:#faf7ef}
td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
.tier{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tier.volunteered{background:var(--ok-bg);color:#155c3d} .tier.asked{background:var(--ayse-bg);color:#173f80}
.tier.reluctant{background:var(--bad-bg);color:#8f2219} .tier.chart{background:#ece6d7;color:var(--ink-2)}
.crit{display:inline-block;font-size:11.5px;font-weight:600;color:#8f2219;margin-top:6px}
.says{font-family:var(--serif);font-style:italic;color:var(--ink-2)}
.small{font-size:13px} .muted{color:var(--ink-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.board{background:#fff;border:10px solid #cfd2d6;border-radius:12px;padding:20px 24px;font-family:var(--hand);font-size:18px;line-height:1.5}
.board div{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed #e4e4e4}
.board div:last-child{border-bottom:0}
.board b{font:700 22px var(--hand);color:#2a4a8a}
.pharm{border-left:4px solid var(--okafor);background:var(--okafor-bg);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px}
.pharm dl{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:12px 0 0}
.pharm dt{color:#4b2c80;font-weight:600;font-size:13px} .pharm dd{margin:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
ul.points{margin:0;padding-left:20px} ul.points li{margin:6px 0}
.issue{margin:8px 0}
.sev{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:6px}
.sev.high{background:var(--bad-bg);color:#8f2219} .sev.medium,.sev.low{background:var(--warn-bg);color:#7a5200}
.empty{color:var(--ink-3)}
@media (max-width:820px){.people,.cols{grid-template-columns:1fr} table{font-size:13px}}
@media print{header{display:none} body{background:#fff} .card,table{box-shadow:none} h2{break-after:avoid} tr{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">OSCEnario Rounds <span>· answer key</span></div>
  <div class="sp"></div>
  <a class="btn ghost" href="portal.html">← Cases and classes</a>
  <a class="btn ghost" id="try">Try this case</a>
  <button class="btn" onclick="print()">Print</button>
</div></header>
<main id="main"><p class="empty">Loading the answer key…</p></main>

<script>
const params = new URLSearchParams(location.search);
const API = (params.get('api') || window.WALTER_API || (location.port === '5500' || location.protocol === 'file:' ? 'http://127.0.0.1:8000' : location.origin)).replace(/\/$/, '');
const CASE = params.get('case') || 'walter';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => (n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
document.getElementById('try').href = 'index.html?case=' + encodeURIComponent(CASE);

(async () => {
  const main = document.getElementById('main');
  let k;
  try {
    const res = await fetch(`${API}/cases/${encodeURIComponent(CASE)}/key`);
    if (!res.ok) throw new Error(res.status === 404 ? 'No case with that id.' : `Server error ${res.status}`);
    k = await res.json();
  } catch (e) { main.innerHTML = `<p class="empty">Couldn't load the answer key. ${esc(e.message)} Is the server running?</p>`; return; }
  document.title = `Answer key: ${k.case.title}`;
  const v = k.validation || {}, rv = k.review;
  const order = { volunteered: 0, asked: 1, reluctant: 2, chart: 3 };
  const facts = k.facts.slice().sort((a, b) => (order[a.tier] - order[b.tier]) || (b.critical - a.critical));
  const pf = k.pharmacist;

  main.innerHTML = `
    <h1>${esc(k.case.title)}</h1>
    <p class="lede">Everything the simulation knows that the student doesn't: every hidden fact, what unlocks it, the handoff that would carry it, and what the caregiver must understand. Status: <b>${k.case.status === 'published' ? 'Published' : 'Draft'}</b>.</p>

    <div class="people">
      <div class="card who"><div class="av p">${esc(initials(k.patient.name))}</div><div><b>${esc(k.patient.name)}, ${esc(k.patient.age)}</b><p>${esc(k.patient.persona)}</p></div></div>
      ${k.caregiver?.name ? `<div class="card who"><div class="av c">${esc(initials(k.caregiver.name))}</div><div><b>${esc(k.caregiver.name)}</b> <span class="muted small">${esc(k.caregiver.relation || '')}${k.caregiver.language ? ' · ' + esc(k.caregiver.language) : ''}</span><p>${esc(k.caregiver.persona || '')}</p></div></div>` : ''}
    </div>

    <h2>How grading works</h2>
    <div class="card"><ol class="how">${k.how_it_works.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>

    <h2>Every fact, and how to unlock it</h2>
    <div class="legend">
      <span><span class="tier volunteered">Volunteered</span> says it on his own</span>
      <span><span class="tier asked">Asked</span> only if asked</span>
      <span><span class="tier reluctant">Reluctant</span> needs a kind, non-judgmental ask, or a second try</span>
      <span><span class="tier chart">Chart</span> already in the chart</span>
    </div>
    <table>
      <thead><tr><th style="width:24%">Fact</th><th style="width:22%">How to unlock it</th><th style="width:24%">What the patient says</th><th>If it's handed off / if it's missed</th></tr></thead>
      <tbody>${facts.map(f => `<tr>
        <td><span class="tier ${esc(f.tier)}">${esc(f.tier[0].toUpperCase() + f.tier.slice(1))}</span><div style="margin-top:6px">${esc(f.label)}</div>${f.critical ? '<div class="crit">Critical: a line on the subway map</div>' : ''}</td>
        <td>${esc(f.unlock_hint || f.tier_means)}</td>
        <td class="says">${f.patient_says ? '"' + esc(f.patient_says) + '"' : '<span class="muted">On the chart</span>'}</td>
        <td>${f.changes_plan ? `<div><b class="small">Adds to the plan:</b> ${esc(f.changes_plan)}</div>` : ''}
            ${f.if_missed ? `<div style="margin-top:6px"><b class="small" style="color:var(--bad)">If missed:</b> ${esc(f.if_missed)}</div>` : ''}
            ${f.pharmacist_backup ? `<div style="margin-top:6px"><b class="small" style="color:var(--okafor)">Backup:</b> the pharmacist can still catch this one.</div>` : ''}
            ${!f.changes_plan && !f.if_missed ? '<span class="muted small">Context only</span>' : ''}</td>
      </tr>`).join('')}</tbody>
    </table>

    <h2>The handoff that carries everything</h2>
    <p class="lede" style="margin-bottom:12px">The specialist only knows what's on the board. This version hands off every critical fact.</p>
    <div class="board">${['S','B','A','R'].map(x => `<div><b>${x}</b><span>${esc(k.ideal_sbar[x])}</span></div>`).join('')}</div>

    <h2>Why the pharmacist shows up</h2>
    <div class="pharm">
      <div>${esc(pf.explained)}</div>
      ${pf.watches ? `<dl>
        <dt>${esc(pf.name || 'Pharmacist')} reads</dt><dd>${esc(pf.watches)}</dd>
        <dt>She catches</dt><dd>${esc(pf.catches)}</dd>
        <dt>She adds</dt><dd>${esc(pf.adds || '')}</dd>
        <dt>Why it matters</dt><dd>${esc(pf.why || '')}</dd>
      </dl>` : ''}
    </div>

    <h2>Discharge: what the caregiver must understand</h2>
    <div class="cols">
      <div class="card"><b>Always in the plan</b><ul class="points">${k.discharge.standard_points.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>
      <div class="card"><b>Only if handed off</b><ul class="points">${k.discharge.conditional_points.map(p => `<li>${esc(p.point)} <span class="muted small">Needs: ${esc(p.only_if_handed_off)}</span></li>`).join('')}</ul></div>
    </div>
    <div class="card" style="margin-top:16px"><b>What counts as understood</b><ul class="points">${k.discharge.teaching_tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>

    <h2>Checks on this case</h2>
    <div class="cols">
      <div class="card"><b>Structure (code)</b>
        ${v.ok && !(v.warnings || []).length ? '<p style="margin:6px 0 0;color:var(--ok)">Runs cleanly. No problems found.</p>' : ''}
        ${(v.errors || []).map(e => `<div class="issue"><span class="sev high">Error</span>${esc(e)}</div>`).join('')}
        ${(v.warnings || []).map(w => `<div class="issue"><span class="sev medium">Warning</span>${esc(w)}</div>`).join('')}</div>
      <div class="card"><b>Clinical review (Claude)</b>
        ${rv ? `<p style="margin:6px 0 0">${esc(rv.verdict)}${rv.note ? ` <span class="muted small">${esc(rv.note)}</span>` : ''}</p>
          ${(rv.issues || []).map(i => `<div class="issue"><span class="sev ${esc(i.severity)}">${esc(i.severity)}</span>${esc(i.where ? i.where + ': ' : '')}${esc(i.issue)}${i.suggestion ? `<div class="muted small">Try: ${esc(i.suggestion)}</div>` : ''}</div>`).join('')}`
        : '<p class="muted" style="margin:6px 0 0">Written by hand, not AI-reviewed.</p>'}</div>
    </div>`;
})();
</script>
</body>
</html>
